name: aaclean_ai
description: AI-assisted waste identification and recycling guidance.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.4.9
  flutter_animate: ^4.5.2
  google_fonts: ^6.3.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  # camera 0.11 currently resolves an Android implementation that is not
  # compatible with Flutter 3.44's Android Gradle Plugin.
  camera_android_camerax: ^0.7.4+2

flutter:
  uses-material-design: true
  assets:
    - assets/data/waste_items_sk.json
